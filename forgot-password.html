<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>استعادة كلمة المرور | AI Tech Academy</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container navbar">
        <a href="index.html" class="brand"><span class="brand-mark">AI</span><span>Tech Academy</span></a>
        <nav class="nav-links">
          <a href="index.html">الرئيسية</a>
          <a href="login.html">تسجيل الدخول</a>
          <a href="register.html">إنشاء حساب</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <h1>استعادة كلمة المرور</h1>
          <p>أدخل بريدك الإلكتروني وسنرسل لك رابط التحديث.</p>
        </div>

        <div id="reset-alert" class="alert info hidden"></div>

        <form id="forgot-password-form" novalidate>
          <div class="form-group">
            <label for="reset-email">البريد الإلكتروني</label>
            <input id="reset-email" type="email" placeholder="name@example.com" required />
            <div class="field-error" data-error-for="reset-email"></div>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">إرسال رابط الاستعادة</button>
        </form>
      </div>
    </main>

    <script src="data/demo-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/security.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
