<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول | AI Tech Academy</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container navbar">
        <a href="index.html" class="brand"><span class="brand-mark">AI</span><span>Tech Academy</span></a>
        <nav class="nav-links">
          <a href="index.html">الرئيسية</a>
          <a href="courses.html">الكورسات</a>
          <a href="ai-teacher.html">المعلم الذكي</a>
        </nav>
        <div class="nav-actions">
          <button class="btn btn-ghost theme-toggle" type="button" data-theme-toggle="toggle" aria-label="تبديل الوضع">
            <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
            <span class="theme-toggle__label">الوضع الداكن</span>
          </button>
          <button type="button" class="btn btn-ghost lang-toggle" data-lang-toggle="toggle" aria-label="Toggle language"
            onclick="const current = localStorage.getItem('ai-tech-language') === 'en' ? 'en' : 'ar'; const next = current === 'ar' ? 'en' : 'ar'; if (window.AI_TECH_ACADEMY_UTILS && window.AI_TECH_ACADEMY_UTILS.applyLanguage) window.AI_TECH_ACADEMY_UTILS.applyLanguage(next);">
            <span class="lang-toggle__icon" aria-hidden="true">🇸🇦</span>
            <span class="lang-toggle__label">AR</span>
          </button>
          <a href="register.html" class="btn btn-primary btn-with-icon">
            <span class="btn-icon" aria-hidden="true">✨</span>
            <span>إنشاء حساب</span>
          </a>
        </div>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <div class="brand" style="justify-content:center; margin-bottom:10px;"><span class="brand-mark">AI</span><span>Tech Academy</span></div>
          <h1 data-i18n="loginTitle">تسجيل الدخول</h1>
          <p data-i18n="loginSubtitle">مرحباً بعودتك، تابع رحلتك التعليمية.</p>
        </div>

        <div id="login-alert" class="alert info hidden"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email" data-i18n="email">البريد الإلكتروني</label>
            <input id="login-email" name="email" type="email" data-i18n-placeholder="placeholderEmail" placeholder="name@example.com" required />
            <div class="field-error" data-error-for="login-email"></div>
          </div>

          <div class="form-group">
            <label for="login-password" data-i18n="password">كلمة المرور</label>
            <div class="input-row">
              <input id="login-password" name="password" type="password" data-i18n-placeholder="placeholderPassword" placeholder="••••••••" required />
              <button class="password-toggle" type="button" data-toggle-password="login-password" aria-label="إظهار كلمة المرور">عرض</button>
            </div>
            <div class="field-error" data-error-for="login-password"></div>
          </div>

          <div class="auth-links">
            <label class="checkbox-row"><input type="checkbox" checked /> <span data-i18n="rememberMe">تذكرني</span></label>
            <a href="forgot-password.html" data-i18n="forgotPassword">نسيت كلمة المرور؟</a>
          </div>

          <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary btn-with-icon" style="width:100%;">
              <span class="btn-icon" aria-hidden="true">🔑</span>
              <span>تسجيل الدخول</span>
            </button>
          </div>
        </form>

        <div class="oauth-grid">
          <button class="oauth-btn" type="button">Google</button>
          <button class="oauth-btn" type="button">GitHub</button>
        </div>

        <p style="text-align:center; color: var(--muted);"><span data-i18n="noAccountPrompt">ليس لديك حساب؟</span> <a href="register.html" data-i18n="register">إنشاء حساب</a></p>
      </div>
    </main>

    <script src="data/demo-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/security.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
