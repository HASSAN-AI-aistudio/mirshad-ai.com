<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الإعدادات | AI Tech Academy</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container navbar">
        <a href="index.html" class="brand"><span class="brand-mark">AI</span><span>Tech Academy</span></a>
        <nav class="nav-links"><a href="student-dashboard.html">لوحة الطالب</a><a href="profile.html">الملف الشخصي</a></nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="auth-card" style="max-width:760px; width:100%;">
          <h1>الإعدادات</h1>
          <form id="settings-form">
            <div class="two-col">
              <div class="form-group">
                <label>اسم العرض</label>
                <input id="settings-display-name" type="text" value="أحمد السلمي" />
              </div>
              <div class="form-group">
                <label>اللغة</label>
                <select id="settings-language"><option value="ar">العربية</option><option value="en">English</option></select>
              </div>
            </div>
            <div class="checkbox-row"><input type="checkbox" id="dark-mode-pref" /><label for="dark-mode-pref">تفعيل الوضع الداكن</label></div>
            <div class="checkbox-row"><input type="checkbox" id="notifications-pref" /><label for="notifications-pref">تفعيل الإشعارات</label></div>
            <button type="submit" class="btn btn-primary" style="margin-top: 18px;">حفظ الإعدادات</button>
          </form>
        </div>
      </div>
    </main>

    <script src="data/demo-data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/security.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (!window.AI_TECH_ACADEMY_UTILS || !window.AI_TECH_ACADEMY_UTILS.requireRole('student')) return;
      });
    </script>
    <script src="js/app.js"></script>
  </body>
</html>
